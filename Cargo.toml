[package]
name = "oxideav-mpeg12video"
version = "0.0.10"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-mpeg12video"
authors = ["Mark Karpeles"]
description = "Pure-Rust MPEG-1 (ISO/IEC 11172-2) and MPEG-2 (H.262 / ISO/IEC 13818-2) video decoder and encoder for oxideav"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-mpeg12video"
keywords = ["multimedia", "video", "mpeg", "mpeg2", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = "0.1"
# Distributed-slice auto-registration into `oxideav_core::REGISTRARS`
# via the `oxideav_core::register!` macro. Tiny crate, no transitive
# deps; works on every target including wasm.
linkme = "0.3"
[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "dct_bench"
harness = false

[[bench]]
name = "frame_bench"
harness = false
